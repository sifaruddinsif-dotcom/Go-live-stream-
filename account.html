<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090914"><link rel="stylesheet" href="style.css"><title>GO LIVE — Account & Rooms</title><style>label{display:block;margin:10px 0;color:#ddd}select{background:#19182b;color:#fff;border:1px solid #3b3150;padding:12px;border-radius:12px;max-width:100%}#media-view{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.row{flex-wrap:wrap}.row .primary{margin-left:auto;margin-top:0}</style></head><body><div class="shell"><header><a class="logo" href="index.html">♛ GO <b>LIVE</b></a><div><a href="index.html">⌂ Home</a></div></header><main style="padding:18px"><h2>GO LIVE Account</h2><p class="note">Use your email and password. Your GO LIVE ID is created automatically.</p><section class="room"><div style="width:100%"><h3>Email Login / Register</h3><p id="status" class="note" role="status">Connecting…</p><label>Email address <input class="input" id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password <input class="input" id="password" type="password" minlength="10" autocomplete="current-password" placeholder="At least 10 characters"></label><button class="primary" id="register">Create account</button> <button class="primary" id="login">Login</button> <button class="primary" id="logout" hidden>Log out</button><p id="account" class="note"></p></div></section><section class="room" id="rooms"><div style="width:100%"><h3>Rooms</h3><button class="primary" id="refresh">Refresh rooms</button><div id="room-list"></div><h3>Create room</h3><input class="input" id="room-title" maxlength="100" placeholder="Room title"><br><select id="room-kind"><option value="voice">Voice party</option><option value="live">Live video room</option></select><button class="primary" id="create">Create room</button><p class="note">Live video/audio requires valid LiveKit environment variables and browser camera/microphone permission.</p><div id="media-view" aria-live="polite"></div><button class="primary" id="leave-media" hidden>Leave media room</button></div></section><section class="room"><div style="width:100%"><h3>Room chat</h3><input class="input" id="room-id" placeholder="Room ID" inputmode="numeric"><button class="primary" id="history">Load chat history</button><div id="messages" aria-live="polite"></div><input class="input" id="message" maxlength="500" placeholder="Type message"><button class="primary" id="send">Send message</button></div></section></main></div><script src="account.js"></script></body></html>
